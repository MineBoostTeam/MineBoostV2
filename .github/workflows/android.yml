name: android

# build on c/cpp changes or workflow changes
on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Disable parallel checkout (avoids a git race that can fail with 'unable to create symlink')
      run: git config --global checkout.workers 1
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
          distribution: 'temurin'
          java-version: '17'
    - name: Build AAB with Gradle
      # We build an AAB as well for uploading to the the Play Store.
      run: cd android; ./gradlew bundlerelease
    - name: Build APKs with Gradle
      # "assemblerelease" is very fast after "bundlerelease".
      run: cd android; ./gradlew assemblerelease
    - name: Build debug APKs with Gradle
      # Unlike assemblerelease, "assembledebug" is auto-signed by Gradle
      # with its built-in debug keystore, so these install straight on
      # a phone without any manual apksigner/keystore step -- useful
      # for testing MineBoostV2-GW builds without setting up release
      # signing secrets in this fork.
      run: cd android; ./gradlew assembledebug
    - name: Save AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: Luanti-release.aab
        path: android/app/build/outputs/bundle/release/app-release.aab
    - name: Save armeabi artifact
      uses: actions/upload-artifact@v4
      with:
        name: Luanti-armeabi-v7a.apk
        path: android/app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    - name: Save arm64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: Luanti-arm64-v8a.apk
        path: android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    - name: Save x86 artifact
      uses: actions/upload-artifact@v4
      with:
        name: Luanti-x86.apk
        path: android/app/build/outputs/apk/release/app-x86-release-unsigned.apk
    - name: Save x86_64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: Luanti-x86_64.apk
        path: android/app/build/outputs/apk/release/app-x86_64-release-unsigned.apk
    - name: Save arm64 debug artifact
      # This is the one to download and install directly on a phone --
      # already signed, ready to install (Settings > allow install from
      # this source, if prompted). Most modern phones are arm64-v8a.
      uses: actions/upload-artifact@v4
      with:
        name: Luanti-arm64-v8a-debug.apk
        path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
    - name: Save armeabi debug artifact
      uses: actions/upload-artifact@v4
      with:
        name: Luanti-armeabi-v7a-debug.apk
        path: android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
