name: cpp_lint

# lint on c/cpp changes or workflow changes
on:
  push:
    paths:
    pull_request:

env:
  CLANG_TIDY: clang-tidy-15

jobs:
  clang_tidy:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        source ./util/ci/common.sh
        install_linux_deps $CLANG_TIDY

    - name: Run clang-tidy
      run: |
        ./util/ci/clang-tidy.sh
