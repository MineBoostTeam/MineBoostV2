name: windows

# Run on every commit (push) and every pull request
on:
  push:
  pull_request:

jobs:
  mingw:
    name: "MinGW cross-compiler (${{ matrix.bits }}-bit)"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext wine wine${{ matrix.bits }}
          sudo ./util/buildbot/download_toolchain.sh /usr

      - name: Build
        run: |
           EXISTING_MINETEST_DIR=$PWD \
           ./util/buildbot/buildwin${{ matrix.bits }}.sh B

      # Check that the resulting binary can run (DLLs etc.)
      - name: Runtime test
        run: |
          dest=$(mktemp -d)
          unzip -q -d "$dest" B/build/*.zip
          cd "$dest"/luanti-*-win*
          wine bin/mbv2.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: "mingw${{ matrix.bits }}"
          path: B/build/*.zip
          if-no-files-found: error

  # NOTE: the "msvc" job (VS 2019 x86/x64-portable) was removed here --
  # it ran on windows-2019, which GitHub Actions fully retired on
  # 2025-06-30, so both matrix legs could never be scheduled and sat
  # "waiting" forever. If MSVC coverage is wanted again, re-add this job
  # on windows-2022 (or windows-2025) with the generator bumped to
  # "Visual Studio 17 2022".
