name: linux

# Run on every commit (push) and every pull request
on:
  push:
  pull_request:
env:
  MINETEST_POSTGRESQL_CONNECT_STRING: 'host=localhost user=minetest password=minetest dbname=minetest'

jobs:
  # NOTE: gcc_7 (ubuntu-20.04) was removed here -- ubuntu-20.04 was fully
  # retired by GitHub Actions on 2025-04-15, so the job could never be
  # scheduled and sat "waiting" forever. If minimum-gcc-version coverage
  # is still wanted, re-add it on a supported image with an old gcc
  # installed via apt (e.g. ubuntu-22.04 + g++-9/g++-10, whichever is the
  # oldest still packaged).

  # Current gcc version
  gcc_14:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps g++-14 libluajit-5.1-dev

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Test
        run: |
          mkdir nowrite
          chmod a-w nowrite
          cd nowrite
          ../bin/mbv2 --run-unittests

  # NOTE: clang_7 (ubuntu-20.04) was removed here for the same reason as
  # gcc_7 above -- ubuntu-20.04 is retired and the job could never run.

  # Current clang version
  clang_18:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps clang-18 lldb

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: clang-18
          CXX: clang++-18

      - name: Test
        run: |
          ./bin/mbv2 --run-unittests

      - name: Integration test + devtest
        run: |
          ./util/test_multiplayer.sh

  # Build with prometheus-cpp (server-only)
  clang_11_prometheus:
    name: "clang_11 (PROMETHEUS=1)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          # civetweb + libcivetweb-dev: required by build_prometheus_cpp.sh
          # below -- see the comment in that script for why (upstream
          # prometheus-cpp now requires a system-installed civetweb, not
          # just its own vendored submodule copy).
          install_linux_deps clang-11 civetweb libcivetweb-dev

      - name: Build prometheus-cpp
        run: ./util/ci/build_prometheus_cpp.sh

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: clang-11
          CXX: clang++-11
          CMAKE_FLAGS: "-DENABLE_PROMETHEUS=1 -DBUILD_CLIENT=0 -DENABLE_CURSES=0"

      - name: Test
        run: |
          ./bin/luantiserver --run-unittests
